services:
  - type: web
    name: khadamati-app-api
    repo: https://github.com/LLLX6/Khadamati
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: KHADAMATI_ENV
        value: production
      - key: KHADAMATI_RELEASE
        value: v1.1.1
      - key: KHADAMATI_SEED_SAMPLE_DATA
        value: false
      - key: KHADAMATI_PUBLIC_URL
        value: https://lllx6.github.io/Khadamati/
      - key: KHADAMATI_ALLOWED_ORIGINS
        value: https://lllx6.github.io
      - key: KHADAMATI_ADMIN_CODE
        sync: false
      - key: KHADAMATI_OTP_PEPPER
        sync: false
      - key: KHADAMATI_MEDIA_SIGNING_KEY
        sync: false
      - key: KHADAMATI_LOGIN_MAX_ATTEMPTS
        value: 5
      - key: KHADAMATI_LOGIN_LOCK_MINUTES
        value: 15
      - key: KHADAMATI_MEDIA_URL_TTL_SECONDS
        value: 900
      - key: KHADAMATI_PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: KHADAMATI_SMTP_HOST
        value: smtp.gmail.com
      - key: KHADAMATI_SMTP_PORT
        value: 587
      - key: KHADAMATI_SMTP_USER
        sync: false
      - key: KHADAMATI_SMTP_PASSWORD
        sync: false
      - key: KHADAMATI_SMTP_FROM_EMAIL
        value: om.khadamati@gmail.com
      - key: KHADAMATI_SMTP_FROM_NAME
        value: Khadamati Administration
      - key: KHADAMATI_SMTP_USE_TLS
        value: 1
      - key: KHADAMATI_SMTP_USE_SSL
        value: 0
