name: Production Readiness Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: Verify repository
        run: python scripts/verify_repository.py
      - name: Compile Python
        run: python -m py_compile server.py khadamati_domain.py export_khadamati_data.py tests/*.py scripts/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Security API tests
        run: python tests/security-api.py
      - name: Isolated API smoke test
        run: python tests/run-smoke-isolated.py
      - name: Isolated low-load API performance
        run: python tests/performance-api.py

  frontend:
    name: Mobile PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test dependency
        run: npm ci
      - name: Audit Node test dependency
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Mobile UI smoke test
        run: npm run test:ui
      - name: Local launch performance
        run: npm run test:performance
