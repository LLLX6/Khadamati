name: Publish Khadamati Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package verified source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag points to a tested commit
        run: |
          python scripts/verify_repository.py
          python -m py_compile server.py khadamati_domain.py khadamati_workflow.py khadamati_security.py khadamati_trust.py khadamati_growth.py khadamati_platform.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Create source package
        run: |
          git archive \
            --format=zip \
            --prefix="khadamati-${GITHUB_REF_NAME}/" \
            --output="khadamati-${GITHUB_REF_NAME}.zip" \
            "${GITHUB_SHA}"
          sha256sum "khadamati-${GITHUB_REF_NAME}.zip" > "khadamati-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish canonical GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "v1.0.0" ]]; then
            while IFS= read -r old_release; do
              if [[ -n "${old_release}" && "${old_release}" != "${GITHUB_REF_NAME}" ]]; then
                gh release delete "${old_release}" --repo "${GITHUB_REPOSITORY}" --yes
              fi
            done < <(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName')
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Khadamati ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "khadamati-${GITHUB_REF_NAME}.zip" \
            "khadamati-${GITHUB_REF_NAME}.zip.sha256"
